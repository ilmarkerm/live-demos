services:
    oracle:
        image: hashidemo-oracle_v2
        build:
            context: hashidemo-oracle/
        ports:
            - 1521:1521
        environment:
            - ORACLE_PWD=Oracle123
        volumes:
            - type: bind
              source: hashidemo-oracle/setup
              target: /opt/oracle/scripts/startup
            - type: bind
              source: .
              target: /live-demos/hashicorp-vault-for-oracle-db
            - oracledb_vol:/opt/oracle/oradata
        networks:
            - hashidemo-net
    vault:
        image: hashidemo-vault_v2
        build:
            context: hashidemo-vault/
        ports:
            - 8200:8200
        volumes:
            - type: bind
              source: .
              target: /live-demos/hashicorp-vault-for-oracle-db
        networks:
            - hashidemo-net
    sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        environment:
            - USER_NAME=oracle
            - LOG_STDOUT=true
        networks:
            - hashidemo-net
    postgres:
        image: postgres:16.15
        shm_size: 128mb
        environment:
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_INITDB_ARGS="--data-checksums"
        ports:
            - 5432:5432
        volumes:
            - type: bind
              source: postgres-init
              target: /docker-entrypoint-initdb.d
            - postgres_vol:/var/lib/postgresql
        networks:
            - hashidemo-net
